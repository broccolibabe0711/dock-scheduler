<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="light dark">
<title>harbor.js demo</title>
<style>
  body { margin: 0; padding: 16px; font: 15px/1.45 system-ui, -apple-system, "Segoe UI", sans-serif;
         background: #f9f9f7; color: #0b0b0b; }
  :root[data-theme="dark"] body { background: #0d0d0d; color: #fff; }
  @media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) body { background: #0d0d0d; color: #fff; } }
  .wrap { max-width: 1100px; margin: 0 auto; }
  .row { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; margin: 0 0 10px; }
  button { font: inherit; padding: 6px 12px; border-radius: 8px; border: 1px solid rgba(128,128,128,.4);
           background: transparent; color: inherit; cursor: pointer; }
  button[aria-pressed="true"] { border-color: #2a78d6; box-shadow: inset 0 0 0 1px #2a78d6; }
  pre { font-size: 13px; white-space: pre-wrap; margin: 10px 0 0; opacity: .8; }
</style>
</head>
<body>
<div class="wrap">
  <div class="row">
    <button id="dayA" aria-pressed="true">12 Sep - clean day</button>
    <button id="dayB" aria-pressed="false">13 Sep - conflicts</button>
    <button id="theme">Theme: auto</button>
  </div>
  <div id="harbor"></div>
  <pre id="out">Click a hull or band: onSelect(occupant) prints here.</pre>
</div>

<script src="harbor.js"></script>
<script>
'use strict';
// Sample data in the shapes the app passes (see /api/berths and /api/loads). "Marsh Landing"
// is not one of the named places, so it is stacked along the south shore as an unknown berth.
const BERTHS = [
  { id: 1, name: 'North Pier West', length_ft: 410, capacity_mode: 'linear' },
  { id: 2, name: 'North Pier Face', length_ft: 75, capacity_mode: 'linear' },
  { id: 3, name: 'North Pier East', length_ft: 240, capacity_mode: 'linear' },
  { id: 4, name: 'Inner Channel', length_ft: 55, capacity_mode: 'linear' },
  { id: 5, name: 'South Float West', length_ft: 90, capacity_mode: 'linear' },
  { id: 6, name: 'South Float East', length_ft: 90, capacity_mode: 'linear' },
  { id: 7, name: 'North Finger Piers', length_ft: null, capacity_mode: 'exclusive' },
  { id: 8, name: 'Small craft slips (institution boats)', length_ft: null, capacity_mode: 'exclusive' },
  { id: 9, name: 'Marsh Landing', length_ft: null, capacity_mode: 'linear' },
];
const stay = (id, name, length_ft, start, end, extra) =>
  Object.assign({ id, name, kind: 'vessel', length_ft, start, end, status: 'confirmed' }, extra);

const tidewatch = stay(101, 'R/V Tidewatch', 95, '2026-09-10', '2026-09-16');
const bluewater = stay(102, 'Barge Bluewater', 110, '2026-09-11', '2026-09-15');
const meridian  = stay(103, 'OSV Meridian', 160, '2026-09-08', '2026-09-20');
const windrose  = stay(106, 'S/Y Windrose', 33, '2026-09-01', '2026-09-30');
const pelagic   = stay(107, 'S/V Pelagic', 30, '2026-09-03', '2026-09-19');
const skiff     = stay(109, 'Skiff 3', 18, '2026-09-12', '2026-09-13');

const DAYS = {
  A: { day: '2026-09-12', occupants: {
        1: [tidewatch, bluewater], 2: [stay(104, 'F/V Kestrel', 72, '2026-09-08', '2026-09-12')], 3: [meridian],
        4: [stay(105, 'M/V Sea Lark', 48, '2026-09-12', '2026-09-12')], 5: [windrose], 7: [pelagic], 8: [skiff] },
       flags: {} },
  B: { day: '2026-09-13', occupants: {
        1: [tidewatch, bluewater, stay(110, 'OSV Deep Anchor', 210, '2026-09-13', '2026-09-26')],  // 95+110+210 > 410
        2: [stay(111, 'R/V Coral Warden', 120, '2026-09-13', '2026-09-15')],                        // 120' on a 75' face
        3: [meridian, stay(112, 'Tug Grit', null, '2026-09-13', '2026-09-14')],                     // a length is missing
        4: [{ id: 114, name: 'Dredging', kind: 'closure', length_ft: null, start: '2026-09-13', end: '2026-09-20', status: 'confirmed' }],
        5: [windrose],
        6: [{ id: 113, name: 'Community sail day', kind: 'event', length_ft: null, start: '2026-09-13', end: '2026-09-13', status: 'confirmed' }],
        7: [pelagic, stay(108, 'S/V Marlin', 38, '2026-09-13', '2026-09-30')],                      // two boats, one slip
        8: [skiff],
        9: [stay(115, 'M/Y Halcyon', 55, '2026-09-13', '2026-09-14', { status: 'planned' })] },
       flags: { overCapacity: new Set([1, 7]), unverifiable: new Set([3]), misfits: new Set([111]), unknownLength: new Set([112]) } },
};

const view = Harbor.create(document.getElementById('harbor'), {
  onSelect: occ => { document.getElementById('out').textContent = 'onSelect: ' + JSON.stringify(occ); },
});
view.setBerths(BERTHS);
function show(key) {
  const d = DAYS[key];
  view.setDay(d.day, d.occupants, d.flags);
  document.getElementById('dayA').setAttribute('aria-pressed', key === 'A');
  document.getElementById('dayB').setAttribute('aria-pressed', key === 'B');
}
document.getElementById('dayA').addEventListener('click', () => show('A'));
document.getElementById('dayB').addEventListener('click', () => show('B'));
setTimeout(() => show('A'), 50);                          // a beat later, so the first hulls visibly sail in

// Theme button: auto -> dark -> light -> auto, via data-theme on <html>, which harbor.js honours.
const THEMES = ['auto', 'dark', 'light'];
document.getElementById('theme').addEventListener('click', ev => {
  const next = THEMES[(THEMES.indexOf(document.documentElement.dataset.theme || 'auto') + 1) % THEMES.length];
  if (next === 'auto') delete document.documentElement.dataset.theme; else document.documentElement.dataset.theme = next;
  ev.target.textContent = 'Theme: ' + next;
});
</script>
</body>
</html>
